<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CI/CD Build Status</title>
  <style>
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif;margin:0;padding:24px;background:#f8f9fb;color:#1a1a2e}
    nav{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap}
    nav a{padding:6px 14px;border-radius:6px;text-decoration:none;font-size:.875rem;background:#fff;border:1px solid #ddd;color:#333}
    nav a.active,nav a:hover{background:#1a1a2e;color:#fff;border-color:#1a1a2e}
    h1{margin:0 0 4px}
    p.sub{color:#666;margin:0 0 20px;font-size:.9rem}
    .status{padding:10px 14px;border-radius:6px;margin-bottom:16px;font-size:.9rem}
    .status.loading{background:#eef2ff;color:#3730a3}
    .status.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
    .refresh{font-size:.8rem;color:#888;margin-bottom:16px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px;margin-bottom:24px}
    .build-card{background:#fff;border:1px solid #e0e0e0;border-radius:10px;padding:16px 18px;display:flex;flex-direction:column;gap:8px;transition:box-shadow .15s}
    .build-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
    .build-header{display:flex;align-items:center;gap:10px}
    .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
    .dot-green{background:#16a34a}
    .dot-yellow{background:#d97706}
    .dot-red{background:#dc2626}
    .dot-unknown{background:#9ca3af}
    .repo-name{font-weight:600;font-size:.95rem;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .build-meta{font-size:.78rem;color:#666;display:flex;justify-content:space-between;align-items:center}
    .view-link{font-size:.78rem;color:#2563eb;text-decoration:none;padding:3px 8px;border:1px solid #bfdbfe;border-radius:5px;white-space:nowrap}
    .view-link:hover{background:#dbeafe}
    .status-label{font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:9999px}
    .label-green{background:#dcfce7;color:#15803d}
    .label-yellow{background:#fef3c7;color:#92400e}
    .label-red{background:#fee2e2;color:#991b1b}
    .label-unknown{background:#f3f4f6;color:#4b5563}
    .cached-badge{font-size:.7rem;color:#9ca3af;margin-left:4px}
    .section-title{font-size:1.1rem;font-weight:700;margin:28px 0 4px}
    .section-sub{font-size:.85rem;color:#666;margin:0 0 14px}
    .pr-list{display:flex;flex-direction:column;gap:10px;max-width:720px}
    .pr-card{background:#fff;border:1px solid #e0e0e0;border-radius:8px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px}
    .pr-number{font-size:.8rem;font-weight:700;color:#6b7280;white-space:nowrap;padding-top:1px}
    .pr-body{flex:1;min-width:0}
    .pr-title{font-size:.9rem;font-weight:600;color:#1a1a2e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pr-meta{font-size:.75rem;color:#9ca3af;margin-top:3px}
    .pr-repo{font-size:.72rem;font-weight:600;background:#f1f5f9;border-radius:4px;padding:1px 6px;color:#475569}
    .pr-draft{font-size:.72rem;font-weight:600;background:#fef3c7;border-radius:4px;padding:1px 6px;color:#92400e}
    .pr-link{font-size:.78rem;color:#2563eb;text-decoration:none;white-space:nowrap;padding:3px 8px;border:1px solid #bfdbfe;border-radius:5px}
    .pr-link:hover{background:#dbeafe}
    .pr-empty{font-size:.875rem;color:#9ca3af;font-style:italic;padding:12px 0}
  </style>
</head>
<body>
  <nav id="main-nav"></nav>
  <script src="/auth.js"></script>
  <script>DashAuth.renderNav('builds');</script>
  <h1>CI/CD Build Status</h1>
  <p class="sub">Latest GitHub Actions run per repository. Refreshes every 60 seconds.</p>

  <div id="global-status" class="status loading">Loading build status…</div>
  <div class="grid" id="build-grid"></div>
  <div id="pr-section" style="display:none">
    <p class="section-title">Open Pull Requests</p>
    <p class="section-sub">Open PRs across all repositories.</p>
    <div id="pr-status" class="status loading" style="display:none">Loading PRs…</div>
    <div class="pr-list" id="pr-list"></div>
  </div>
  <div class="refresh" id="refresh-note"></div>

  <script>
    function relativeTime(iso) {
      if (!iso) return '';
      const diff = Date.now() - new Date(iso).getTime();
      const s = Math.floor(diff / 1000);
      if (s < 60) return s + 's ago';
      const m = Math.floor(s / 60);
      if (m < 60) return m + 'm ago';
      const h = Math.floor(m / 60);
      if (h < 24) return h + 'h ago';
      return Math.floor(h / 24) + 'd ago';
    }

    const STATUS_DOT   = { green:'dot-green', yellow:'dot-yellow', red:'dot-red', unknown:'dot-unknown' };
    const STATUS_LABEL = { green:'label-green', yellow:'label-yellow', red:'label-red', unknown:'label-unknown' };
    const STATUS_TEXT  = { green:'Passing', yellow:'Running', red:'Failed', unknown:'Unknown' };

    async function loadAll() {
      const gs = document.getElementById('global-status');
      let builds;
      try {
        const r = await fetch('/api/builds');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        builds = await r.json();
      } catch (e) {
        gs.className = 'status error';
        gs.textContent = 'Could not load build status: ' + e.message;
        return;
      }

      gs.style.display = 'none';
      const grid = document.getElementById('build-grid');
      grid.innerHTML = '';

      builds.forEach(b => {
        const ds = b.display_status || 'unknown';
        const card = document.createElement('div');
        card.className = 'build-card';

        card.innerHTML = `
          <div class="build-header">
            <span class="dot ${STATUS_DOT[ds] || 'dot-unknown'}"></span>
            <span class="repo-name" title="${b.repo}">${b.repo}</span>
            <span class="status-label ${STATUS_LABEL[ds] || 'label-unknown'}">${STATUS_TEXT[ds] || ds}</span>
            ${b.cached ? '<span class="cached-badge">(cached)</span>' : ''}
          </div>
          <div class="build-meta">
            <span>${relativeTime(b.run_at)}</span>
            ${b.html_url ? `<a class="view-link" href="${b.html_url}" target="_blank" rel="noopener">View run →</a>` : ''}
          </div>
        `;
        grid.appendChild(card);
      });

      document.getElementById('refresh-note').textContent =
        'Last updated: ' + new Date().toLocaleTimeString();
    }

    async function loadPRs() {
      if (!DashAuth.isAdmin()) return;
      document.getElementById('pr-section').style.display = '';
      const ps = document.getElementById('pr-status');
      ps.style.display = '';
      ps.className = 'status loading';
      ps.textContent = 'Loading PRs…';
      const list = document.getElementById('pr-list');
      list.innerHTML = '';
      try {
        const r = await DashAuth.authFetch('/api/prs');
        if (!r.ok) throw new Error('HTTP ' + r.status);
        const prs = await r.json();
        ps.style.display = 'none';
        if (!prs.length) {
          list.innerHTML = '<p class="pr-empty">No open pull requests.</p>';
          return;
        }
        prs.forEach(function(pr) {
          var updated = relativeTime(pr.updated_at);
          var card = document.createElement('div');
          card.className = 'pr-card';
          card.innerHTML =
            '<span class="pr-number">#' + pr.number + '</span>' +
            '<div class="pr-body">' +
              '<div class="pr-title" title="' + pr.title + '">' + pr.title + '</div>' +
              '<div class="pr-meta">' +
                '<span class="pr-repo">' + pr.repo + '</span>' +
                (pr.draft ? ' <span class="pr-draft">Draft</span>' : '') +
                ' &nbsp;by <strong>' + pr.author + '</strong>' +
                ' &nbsp;· updated ' + updated +
              '</div>' +
            '</div>' +
            '<a class="pr-link" href="' + pr.html_url + '" target="_blank" rel="noopener">View →</a>';
          list.appendChild(card);
        });
      } catch(e) {
        ps.className = 'status error';
        ps.textContent = 'Could not load PRs: ' + e.message;
      }
    }

    loadAll();
    loadPRs();
    setInterval(loadAll, 60000);
    setInterval(loadPRs, 120000);
  </script>
</body>
</html>
