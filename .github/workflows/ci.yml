name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Install optional target
        run: rustup target add x86_64-unknown-linux-gnu || true

      - name: Cargo check
        run: cargo check --workspace --all-targets

      - name: Run tests
        run: cargo test --workspace -- --nocapture

      - name: Audit dependencies for known vulnerabilities
        # Informational: surfaces RustSec advisories in CI without blocking on
        # advisories that have no fixed upstream release yet (e.g. rsa
        # RUSTSEC-2023-0071). Tighten to a blocking gate once an audit.toml
        # documenting accepted/ignored advisories is in place.
        continue-on-error: true
        run: |
          cargo install cargo-audit --locked
          cargo audit
