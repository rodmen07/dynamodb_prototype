name: Build and publish Docker image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/dynamodb-dashboard:latest
            ghcr.io/${{ github.repository_owner }}/dynamodb-dashboard:${{ github.sha }}

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly
        run: |
          set +e
          OUTPUT=$(flyctl deploy --image ghcr.io/${{ github.repository_owner }}/dynamodb-dashboard:${{ github.sha }} --app "${FLY_APP_NAME}" 2>&1)
          STATUS=$?
          set -e

          if [ "$STATUS" -ne 0 ] && echo "$OUTPUT" | grep -qi "app not found"; then
            echo "Fly app '${FLY_APP_NAME}' was not found; skipping deploy without failing the workflow."
            echo "$OUTPUT"
            exit 0
          fi

          echo "$OUTPUT"
          exit "$STATUS"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP_NAME: ${{ vars.FLY_APP_NAME || 'dynamodb-dashboard-rodmen07' }}
